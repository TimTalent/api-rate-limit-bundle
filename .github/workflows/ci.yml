name: "Continuous Integration"

on:
  push:
  pull_request:

env:
  COMPOSER_ALLOW_SUPERUSER: '1' # https://getcomposer.org/doc/03-cli.md#composer-allow-superuser
  SHELL_VERBOSITY: 1

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, API Platform ${{ matrix.api-platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.1'
            symfony: '5.4.*'
            api-platform: '^2.7'
            lowest: true
          - php: '8.1'
            symfony: '5.4.*'
            api-platform: '^2.7'
          - php: '8.2'
            symfony: '6.4.*'
            api-platform: '^2.7'
          - php: '8.3'
            symfony: '6.4.*'
            api-platform: '^3.0'
          - php: '8.3'
            symfony: '7.*'
            api-platform: '^3.0'
      fail-fast: false
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          extensions: intl
          ini-values: memory_limit=-1
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-composer-

      # API Platform 2.7 has published security advisories, it is still the only version supporting Symfony 5.4.
      - name: Allow packages with security advisories
        run: composer config audit.block-insecure false

      - name: Pin Symfony and API Platform versions
        run: |
          composer require --no-update --no-interaction \
            "api-platform/core:${{ matrix.api-platform }}" \
            "symfony/cache:${{ matrix.symfony }}" \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/security-bundle:${{ matrix.symfony }}"

      - name: Install dependencies
        if: matrix.lowest
        run: composer update --ansi --no-interaction --no-progress --prefer-dist --prefer-lowest

      - name: Install dependencies
        if: '!matrix.lowest'
        run: composer update --ansi --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
